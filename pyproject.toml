[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darija-eval-set"
version = "0.1.0"
description = "Open benchmark of Moroccan Darija prompts with expected answers, plus a runner that scores any model or API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mohamed-Taqy Salmi" }]
keywords = ["darija", "moroccan-arabic", "llm-evaluation", "benchmark", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
darija-eval = "darija_eval_set.cli:app"

[project.urls]
Homepage = "https://mohamedtaqysalmi.github.io/darija-eval-set/"
Repository = "https://github.com/mohamedtaqysalmi/darija-eval-set"
Changelog = "https://github.com/mohamedtaqysalmi/darija-eval-set/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/darija_eval_set"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Arabic letters are flagged as look-alikes of Latin ones; they are intentional here
"src/darija_eval_set/scoring.py" = ["RUF001"]
"src/darija_eval_set/judge.py" = ["RUF001"]
"scripts/*" = ["E501", "RUF001"]
"tests/*" = ["RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=darija_eval_set --cov-report=term-missing"

[tool.coverage.run]
source = ["darija_eval_set"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
