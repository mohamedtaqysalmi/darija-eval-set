name: Bug report
description: Something in the runner, schema or dataset behaves wrongly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command or code you ran, and the dataset item id if it is about a specific item.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: darija-eval-set version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or traceback
      render: text
