name: Feature request
description: Suggest a change to the dataset, schema, runner or scoring.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to see
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
